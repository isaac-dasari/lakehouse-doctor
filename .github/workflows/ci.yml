name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .[dev]

      - name: Run lint
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Run demo workflow
        run: |
          lakehouse-doctor scan examples/sample_lakehouse --primary-key order_id --output baseline.json
          lakehouse-doctor report --input baseline.json --html --output report.html
          lakehouse-doctor check --input baseline.json --fail-on critical
          lakehouse-doctor scan examples/sample_lakehouse --primary-key order_id --output latest.json
          lakehouse-doctor compare baseline.json latest.json
          test -f baseline.json
          test -f latest.json
          test -f report.html
          lakehouse-doctor rules
